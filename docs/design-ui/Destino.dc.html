<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caramelo · Destino</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4531A}a:hover{color:#5A1E0E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3F1ED; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2E140A; overflow: hidden; display: flex; flex-direction: column; padding: 24px 20px 20px; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Inicio.dc.html" aria-label="Fechar" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; color: #2E140A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    <p style="margin: 0; font-size: 16px; font-weight: 700">Para onde vamos?</p>
    <span style="width: 48px"></span>
  </div>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 10px; height: 10px; border-radius: 50%; background: #2F7A55; flex: none; margin: 0 5px"></span>
      <span style="font-size: 14px; color: #6E6762">Localização atual</span>
    </div>
    <div style="height: 1px; background: #F0ECE6; margin-left: 32px"></div>
    <label style="display: flex; align-items: center; gap: 12px">
      <span style="width: 10px; height: 10px; border-radius: 2px; background: #B4531A; flex: none; margin: 0 5px"></span>
      <input type="text" value="{{ query }}" onInput="{{ onType }}" placeholder="Digite o destino" aria-label="Destino" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 15px; font-weight: 600; color: #2E140A; background: transparent; padding: 8px 0">
    </label>
  </section>

  <div style="display: flex; gap: 10px">
    <button type="button" onClick="{{ pickHome }}" style="flex: 1; background: #FFFFFF; border: 0; border-radius: 20px; padding: 12px 14px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #FFE9D1; color: #5A1E0E; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 700">Casa</span><span style="font-size: 12px; color: #6E6762; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Av. Paulista, 1000</span></span>
    </button>
    <button type="button" style="flex: 1; background: #FFFFFF; border: 1.5px dashed #E4DFD8; border-radius: 20px; padding: 12px 14px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 12px; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">Trabalho</span><span style="font-size: 12px; color: #B4531A; font-weight: 600">Definir</span></span>
    </button>
  </div>

  <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6E6762">Recentes</span>
  <section style="background: #FFFFFF; border-radius: 24px; padding: 4px 16px">
    <button type="button" onClick="{{ pick1 }}" style="width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0ECE6">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
      <span style="font-size: 14px; font-weight: 600">Shopping Cidade Jardim</span>
    </button>
    <button type="button" onClick="{{ pick2 }}" style="width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0ECE6">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
      <span style="font-size: 14px; font-weight: 600">Av. Faria Lima, 3400</span>
    </button>
    <button type="button" onClick="{{ pick3 }}" style="width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; padding: 12px 0">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>
      <span style="font-size: 14px; font-weight: 600">Rua Augusta, 500</span>
    </button>
  </section>

  <a href="{{ confirmHref }}" style="{{ confirmStyle }}">Confirmar destino</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { query: '' };
  }
  renderVals() {
    const q = this.state.query;
    const ok = q.trim().length > 0;
    return {
      query: q,
      onType: (e) => this.setState({ query: e.target.value }),
      pickHome: () => this.setState({ query: 'Av. Paulista, 1000' }),
      pick1: () => this.setState({ query: 'Shopping Cidade Jardim' }),
      pick2: () => this.setState({ query: 'Av. Faria Lima, 3400' }),
      pick3: () => this.setState({ query: 'Rua Augusta, 500' }),
      confirmHref: ok ? 'Escolha.dc.html' : '#',
      confirmStyle: 'margin-top: auto; height: 54px; border-radius: 999px; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ' +
        (ok ? 'background: #B4531A; color: #FFFFFF' : 'background: #FFFFFF; color: #6E6762; border: 1.5px solid #E4DFD8'),
    };
  }
}
</script>
</body>
</html>
