<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caramelo · Carteira</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4531A}a:hover{color:#5A1E0E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3F1ED; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2E140A; overflow: hidden; display: flex; flex-direction: column; padding: 24px 20px 20px; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Inicio.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; color: #2E140A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <p style="margin: 0; font-size: 16px; font-weight: 700">Carteira</p>
    <span style="width: 48px"></span>
  </div>

  <p style="margin: 0; padding: 12px 14px; border-radius: 16px; background: #FFFFFF; font-size: 13px; line-height: 1.45; color: #6E6762">Modo demonstração: nenhum pagamento é cobrado e nenhum dado de cartão é pedido.</p>

  <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6E6762">Forma de pagamento</span>
  <div role="radiogroup" aria-label="Forma de pagamento" style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" role="radio" aria-checked="{{ pixOn }}" onClick="{{ setPix }}" style="{{ pixStyle }}">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #FFE9D1; color: #5A1E0E; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7"/></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 15px; font-weight: 700">Pix</span><span style="font-size: 12px; color: #6E6762">Pague pelo app do seu banco ao final</span></span>
    </button>
    <button type="button" role="radio" aria-checked="{{ cashOn }}" onClick="{{ setCash }}" style="{{ cashStyle }}">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 15px; font-weight: 700">Dinheiro</span><span style="font-size: 12px; color: #6E6762">Pague direto ao motorista</span></span>
    </button>
    <button type="button" role="radio" aria-checked="{{ cardOn }}" onClick="{{ setCard }}" style="{{ cardStyle }}">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 15px; font-weight: 700">Cartão</span><span style="font-size: 12px; color: #6E6762">Cartão de demonstração, sem cobrança</span></span>
    </button>
  </div>

  <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6E6762">Cupom</span>
  <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #3A1A0F; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F08A1C"></span>CARAMELO10</span>
      <button type="button" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E4DFD8; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #2E140A">Remover</button>
    </div>
    <span style="font-size: 12px; color: #6E6762">10% de desconto, até R$ 10, na próxima corrida</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { m: 'pix' };
  }
  opt(on) {
    return 'width: 100%; background: #FFFFFF; border-radius: 20px; padding: 12px 14px; font: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 12px; box-sizing: border-box; ' +
      (on ? 'border: 2px solid #B4531A' : 'border: 1px solid #E4DFD8');
  }
  renderVals() {
    const m = this.state.m;
    return {
      pixOn: m === 'pix', pixStyle: this.opt(m === 'pix'), setPix: () => this.setState({ m: 'pix' }),
      cashOn: m === 'cash', cashStyle: this.opt(m === 'cash'), setCash: () => this.setState({ m: 'cash' }),
      cardOn: m === 'card', cardStyle: this.opt(m === 'card'), setCard: () => this.setState({ m: 'card' }),
    };
  }
}
</script>
</body>
</html>
