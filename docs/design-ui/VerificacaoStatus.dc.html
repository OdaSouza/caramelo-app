<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Caramelo · Status da verificação</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4531A}a:hover{color:#5A1E0E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3F1ED; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2E140A; overflow: hidden; display: flex; flex-direction: column; padding: 24px 20px 20px; gap: 18px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Verificacao.dc.html" aria-label="Voltar" style="width: 48px; height: 48px; border-radius: 50%; background: #FFFFFF; color: #2E140A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <p style="margin: 0; font-size: 16px; font-weight: 700">Verificação de segurança</p>
    <span style="width: 48px"></span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 8px">
    <div style="{{ halo }}">
      <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="{{ iconApproved }}"><path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.7 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="{{ iconReview }}"><path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/></svg>
    </div>
    <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="{{ dot }}"></span>{{ pill }}</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px">{{ title }}</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6E6762; max-width: 310px">{{ body }}</p>
  </div>

  <section aria-label="Etapas" style="background: #FFFFFF; border-radius: 24px; padding: 8px 18px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0"><span style="{{ s1 }}"></span><span style="font-size: 14px; font-weight: 600">Documentos enviados</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0"><span style="{{ s2 }}"></span><span style="font-size: 14px; font-weight: 600">Checagem de identidade e antecedentes</span></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0"><span style="{{ s3 }}"></span><span style="{{ s3text }}">Liberado para dirigir</span></div>
  </section>

  <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #F3F1ED; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E140A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="5"/><path d="M12 14v8M9 19h6"/></svg></span>
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">Grupo no filtro: Mulher</span><span style="font-size: 12px; color: #6E6762">Autodeclarado. A checagem é refeita todo ano.</span></span>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button type="button" onClick="{{ toggle }}" style="height: 50px; border-radius: 999px; border: 1.5px dashed #C9C1B8; background: transparent; color: #6E6762; font: inherit; font-size: 14px; font-weight: 700">{{ toggleLabel }}</button>
    <a href="Inicio.dc.html" style="height: 54px; border-radius: 999px; background: #B4531A; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Voltar ao mapa</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { approved: false };
  }
  step(kind) {
    const base = 'width: 22px; height: 22px; border-radius: 50%; flex: none; box-sizing: border-box; ';
    if (kind === 'done') return base + 'background: #2F7A55; box-shadow: inset 0 0 0 6px #2F7A55, inset 0 0 0 8px #FFFFFF';
    if (kind === 'current') return base + 'border: 3px solid #F08A1C; background: #FFE9D1';
    return base + 'border: 2px solid #E4DFD8';
  }
  renderVals() {
    const a = this.state.approved;
    return {
      halo: 'width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' +
        (a ? 'background: rgba(47,122,85,0.15); color: #2F7A55' : 'background: #FFE9D1; color: #B4531A'),
      iconApproved: a ? '' : 'display: none',
      iconReview: a ? 'display: none' : '',
      dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (a ? '#2F7A55' : '#F08A1C'),
      pill: a ? 'Verificado' : 'Em análise',
      title: a ? 'Você está verificado' : 'Recebemos seus documentos',
      body: a
        ? 'Seu selo de verificado já aparece para os passageiros nas suas propostas.'
        : 'A equipe Caramelo está conferindo sua identidade e seus antecedentes. Você recebe um aviso quando terminar.',
      s1: this.step('done'),
      s2: this.step(a ? 'done' : 'current'),
      s3: this.step(a ? 'done' : 'pending'),
      s3text: 'font-size: 14px; font-weight: 600; color: ' + (a ? '#2E140A' : '#6E6762'),
      toggle: () => this.setState({ approved: !a }),
      toggleLabel: a ? 'Ver estado "Em análise"' : 'Simular aprovação (só em teste)',
    };
  }
}
</script>
</body>
</html>
